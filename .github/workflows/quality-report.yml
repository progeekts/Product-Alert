name: Informe de calidad

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Informe
        run: python scripts/report_quality.py
      - name: Auditoría
        run: python scripts/audit_data.py
