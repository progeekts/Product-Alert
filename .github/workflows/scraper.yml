name: Actualizar central de alertas

on:
  schedule:
    - cron: '15 6 * * *'
    - cron: '15 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Consultar fuentes oficiales
        run: python scripts/scraper.py

      - name: Guardar registro actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alertas.json
          if ! git diff --cached --quiet; then
            git commit -m "data: actualizar alertas oficiales [skip ci]"
            git push
          else
            echo "Sin cambios en el registro."
          fi
