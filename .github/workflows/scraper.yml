name: Actualizador de Alertas de Consumo

on:
  schedule:
    - cron: '0 6 * * *' # Ejecución diaria a las 06:00 UTC
  workflow_dispatch:      # Permite ejecución manual

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Ejecutar rastreador
        run: python scripts/scraper.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/alertas.json
          
          # Realizar commit solo si hay diferencias detectadas
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualización automática de alertas.json [skip ci]"
            git push
          else
            echo "No se encontraron nuevas alertas."
          fi