<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Ficha de alerta de seguridad de producto en Product Alert España"><title>Alerta · Product Alert España</title><style>:root{--bg:#f4f7fa;--card:#fff;--ink:#102235;--muted:#657487;--line:#dce5ed;--blue:#075ca8;--navy:#071d31;--green:#067647;--eu:#5540a5;--amber:#a64b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1050px;margin:auto;padding:0 20px}.top{background:var(--navy);color:#fff}.top .wrap{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:15px}.top a{color:#fff;text-decoration:none;font-weight:800}.brand{font-size:20px}main{padding:24px 0 50px}.card,.block{background:#fff;border:1px solid var(--line);border-radius:15px}.card{padding:22px}.head{display:grid;grid-template-columns:220px 1fr;gap:24px}.image{width:220px;height:220px;object-fit:contain;border:1px solid #e5eaf0;border-radius:12px;background:#f7f9fb}.noimg{width:220px;height:220px;border-radius:12px;background:#f1f4f7;display:grid;place-items:center;color:var(--muted)}h1{font-size:clamp(25px,4vw,38px);line-height:1.15;margin:10px 0}.badges,.facts{display:flex;gap:7px;flex-wrap:wrap}.badge,.fact{padding:5px 9px;border-radius:8px;font-size:12px}.badge{background:#edf5fc;color:var(--blue);font-weight:800}.badge.eu{background:#f1efff;color:var(--eu)}.badge.es{background:#ecfdf3;color:var(--green)}.fact{background:#f7f9fb;border:1px solid #e5eaf0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:14px}.block{padding:18px}.block h2{font-size:17px;margin:0 0 9px}.block p{margin:5px 0}.wide{grid-column:1/-1}.action{border-left:4px solid var(--blue)}.official{border-left:4px solid var(--green)}.geo{border-left:4px solid var(--eu)}.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{display:inline-block;padding:10px 14px;border-radius:9px;background:var(--blue);color:#fff;text-decoration:none;font-weight:800}.btn.alt{background:#fff;color:var(--blue);border:1px solid #b9cde0}.notice{margin-top:14px;color:var(--muted);font-size:13px}.error{text-align:center;padding:45px 20px}@media(max-width:700px){.head{grid-template-columns:1fr}.image,.noimg{width:100%;height:260px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html">Product Alert España</a><a href="index.html">← Volver al buscador</a></div></header><main><div class="wrap"><div id="app" class="card"><div class="error">Cargando alerta…</div></div></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const arr=v=>Array.isArray(v)?v:[];const fmt=d=>{if(!d)return'No indicada';let x=new Date(d+'T12:00:00');return isNaN(x)?d:x.toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'})};const isEU=x=>x.source_id==='eu_safety_gate'||x.geographic_scope==='UE/EEE';const geo=x=>!isEU(x)?{label:'España',text:'Alerta procedente de una fuente oficial española.'}:x.notified_by_spain?{label:'UE/EEE · Notificada por España',text:'España figura como país notificante en los datos recopilados de Safety Gate. Esto no demuestra por sí solo dónde se comercializó el producto.'}:x.spain_follow_up?{label:'UE/EEE · Seguimiento de España',text:'España figura con una actuación de seguimiento de esta alerta. No debe interpretarse automáticamente como prueba de comercialización del producto en España.'}:{label:'UE/EEE',text:'Alerta de Safety Gate. Los datos recopilados no identifican actualmente una relación específica con España.'};function list(v){let a=arr(v).filter(Boolean);return a.length?esc(a.join(', ')):'No consta en los datos recopilados'}async function init(){let id=new URLSearchParams(location.search).get('id'),app=document.getElementById('app');if(!id){app.innerHTML='<div class="error"><h1>Alerta no indicada</h1><p>Vuelve al buscador y selecciona una alerta.</p></div>';return}try{let r=await fetch('data/alertas.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();let db=await r.json(),x=(db.alerts||[]).find(a=>a.id===id);if(!x){app.innerHTML='<div class="error"><h1>Alerta no encontrada</h1><p>Puede haber cambiado el registro. Vuelve al buscador.</p></div>';return}let g=geo(x),measures=arr(x.measures).filter(Boolean);document.title=(x.product||x.title)+' · Product Alert España';app.innerHTML=`<div class="head">${x.image?`<img class="image" src="${esc(x.image)}" alt="Imagen oficial del producto" referrerpolicy="no-referrer">`:'<div class="noimg">Sin imagen oficial</div>'}<div><div class="badges"><span class="badge">${esc(x.agency)}</span><span class="badge">${esc(x.category)}</span><span class="badge ${isEU(x)?'eu':'es'}">${esc(g.label)}</span></div><h1>${esc(x.title)}</h1><p class="muted">Publicada: ${fmt(x.date)}${x.reference?' · Referencia '+esc(x.reference):''}</p><div class="facts">${arr(x.brands).length?`<span class="fact"><b>Marca:</b> ${list(x.brands)}</span>`:''}${arr(x.models).length?`<span class="fact"><b>Modelo:</b> ${list(x.models)}</span>`:''}${x.risk?`<span class="fact"><b>Riesgo:</b> ${esc(x.risk)}</span>`:''}</div><div class="btns"><a class="btn" href="${esc(x.link)}" target="_blank" rel="noopener">Abrir publicación oficial</a><a class="btn alt" href="index.html">Buscar otras alertas</a></div></div></div><div class="grid"><section class="block wide"><h2>¿Qué producto es?</h2><p>${esc(x.product||x.description||x.title)}</p><p><b>Marca:</b> ${list(x.brands)} · <b>Modelo:</b> ${list(x.models)}</p><p><b>Lotes:</b> ${list(x.lotes)} · <b>Códigos/EAN:</b> ${list(x.barcodes)}</p></section><section class="block"><h2>¿Cuál es el problema?</h2><p>${esc(x.description||'La descripción resumida no consta en los datos recopilados.')}</p>${x.risk?`<p><b>Riesgo:</b> ${esc(x.risk)}</p>`:''}${x.legal_provision?`<p><b>Normativa:</b> ${esc(x.legal_provision)}</p>`:''}</section><section class="block official"><h2>¿Qué medidas oficiales constan?</h2><p>${measures.length?esc(measures.join(' · ')):'No se han podido estructurar medidas específicas en este registro. Consulta la publicación oficial.'}</p></section><section class="block action"><h2>¿Qué debe hacer el consumidor?</h2><p>${esc(x.consumer_action||'Consulta la publicación oficial para conocer las recomendaciones aplicables a este producto.')}</p></section><section class="block geo"><h2>¿Qué relación tiene con España?</h2><p>${esc(g.text)}</p>${x.notifying_country?`<p><b>País notificante:</b> ${esc(x.notifying_country)}</p>`:''}${x.country_origin?`<p><b>Origen:</b> ${esc(x.country_origin)}</p>`:''}</section></div><p class="notice">Product Alert España es un proyecto independiente. La publicación del organismo oficial enlazada arriba prevalece siempre sobre este resumen.</p>`}catch(e){app.innerHTML='<div class="error"><h1>No se pudo cargar la alerta</h1><p>Inténtalo de nuevo o vuelve al buscador.</p></div>'}}init();</script></body></html>
